version: 1
project: hello

env:
  DATABASE_PATH: ${PARCELA_DATA_DIR}/hello.sqlite3

services:
  web:
    command: python3 -m http.server $PORT --bind 127.0.0.1
    http:
      healthcheck: /
  api:
    command: python3 api.py
    http:
      subdomain: api
      healthcheck: /
  ticker:
    command: python3 worker.py

hooks:
  setup:
    command: python3 db.py setup

tasks:
  messages:
    command: python3 db.py list
