version: 1
project:
  id: shirabe
  name: shirabe
default_service: web
services:
  web:
    readiness_path: /up
inherit_environment: false
environment:
  RAILS_ENV: development
  SHIRABE_PREVIEW: "1"
  SHIRABE_DATABASE_DIRECTORY: "${PARCELA_RUNTIME_DIR}/data"
  SHIRABE_UPLOADS_DIRECTORY: "${PARCELA_RUNTIME_DIR}/uploads"
  BOOTSNAP_CACHE_DIR: "${PARCELA_RUNTIME_DIR}/cache/bootsnap"
  TMPDIR: "${PARCELA_RUNTIME_DIR}/tmp"
  PIDFILE: "${PARCELA_RUNTIME_DIR}/tmp/pids/server.pid"
  PUMA_ENABLE_METRICS: "0"
  LOG_JSON: "1"
  SKIP_TEST_DATABASE: "1"
  SHIRABE_RUN_JOBS: "0"
  SOLID_QUEUE_SKIP_RECURRING: "true"
tasks:
  prepare:
    argv: [bin/rails, runner, script/parcela_prepare.rb]
    timeout_seconds: 180
  web:
    argv: [bin/rails, server, -b, 127.0.0.1]
process_compose:
  version: "0.5"
  processes:
    web:
      command: "bin/rails server -b 127.0.0.1"
      availability:
        restart: "no"
    css:
      disabled: true
      command: "bin/rails tailwindcss:watch[always]"
      availability:
        restart: "no"
    jobs:
      disabled: true
      command: "bin/jobs"
      availability:
        restart: "no"
# Enable CSS/jobs deliberately after web acceptance; also set SHIRABE_RUN_JOBS=1.
# No SDK watcher, bin/dev, imports, live snapshots or copied pending jobs.
