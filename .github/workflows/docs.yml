name: Documentation

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/website/**'
      - 'docs/documentation.md'
      - 'docs/configuration.md'
      - '.agents/skills/parcela/SKILL.md'
      - 'examples/docs-demo/**'
      - 'logo.svg'
      - 'scripts/check_docs.py'
      - 'scripts/check_docs_example.py'
      - 'tests/test_docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, docs-site]
    paths:
      - 'docs/site/**'
      - 'docs/website/**'
      - 'docs/documentation.md'
      - 'docs/configuration.md'
      - '.agents/skills/parcela/SKILL.md'
      - 'examples/docs-demo/**'
      - 'logo.svg'
      - 'scripts/check_docs.py'
      - 'scripts/check_docs_example.py'
      - 'tests/test_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci --prefix docs/website
      - run: python -m unittest discover -s tests -p 'test_docs.py'
      - run: python scripts/check_docs.py --output docs-check.json
      - run: npm run build --prefix docs/website
        env:
          DOCS_SITE: https://parcela.davafons.com
          DOCS_BASE: /docs/
      - uses: actions/upload-artifact@v4
        with:
          name: parcela-docs
          path: |
            target/docs
            docs-check.json
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    environment:
      name: docs
      url: https://parcela.davafons.com/docs/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci --prefix docs/website
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret (Workers Scripts:Edit, Workers Routes:Edit, Zone:Read for davafons.com) to deploy the docs."
            exit 1
          fi
          npm run deploy --prefix docs/website
