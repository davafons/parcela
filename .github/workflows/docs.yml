name: Documentation

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/website/**'
      - 'docs/documentation.md'
      - 'docs/configuration.md'
      - '.agents/skills/parcela/SKILL.md'
      - 'examples/docs-demo/**'
      - 'assets/brand/logo.svg'
      - 'scripts/check_docs.py'
      - 'scripts/check_docs_example.py'
      - 'tests/test_docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main, docs-site]
    paths:
      - 'docs/site/**'
      - 'docs/website/**'
      - 'docs/documentation.md'
      - 'docs/configuration.md'
      - '.agents/skills/parcela/SKILL.md'
      - 'examples/docs-demo/**'
      - 'assets/brand/logo.svg'
      - 'scripts/check_docs.py'
      - 'scripts/check_docs_example.py'
      - 'tests/test_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci --prefix docs/website
      - run: python -m unittest discover -s tests -p 'test_docs.py'
      - run: python scripts/check_docs.py --output docs-check.json
      - run: npm run build --prefix docs/website
        env:
          DOCS_SITE: https://parcela.davafons.com
          DOCS_BASE: /docs/
      - name: Assemble the Pages site
        run: |
          mkdir -p target/pages
          mv target/docs target/pages/docs
          cp target/pages/docs/404.html target/pages/404.html
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/docs/"><link rel="canonical" href="https://parcela.davafons.com/docs/"><a href="/docs/">Parcela docs</a>\n' > target/pages/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}docs/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
