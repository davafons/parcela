name: Documentation

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/website/**'
      - '.agents/skills/parcela/SKILL.md'
      - 'examples/docs-demo/**'
      - 'assets/brand/logo.svg'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/website/**'
      - '.agents/skills/parcela/SKILL.md'
      - 'examples/docs-demo/**'
      - 'assets/brand/logo.svg'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/website/package-lock.json
      - run: npm ci --prefix docs/website
      - run: npm run check --prefix docs/website
      # target/docs is the whole site; docs/website/wrangler.jsonc serves it at parcela.run.
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: docs/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.94.0 deploy
