name: debug macos
on: workflow_dispatch
jobs:
  debug:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci-tools
      - run: cargo build --locked
      - name: probe
        run: |
          cat > /tmp/fq.py <<'PY'
          import socket, time, sys
          t = time.time()
          print(sys.argv[1], socket.getfqdn('127.0.0.1'), round(time.time() - t, 2), flush=True)
          PY
          env | cut -d= -f1 | sort | tr '\n' ' '; echo
          for v in $(env | cut -d= -f1); do
            out=$(env -i PATH=$PATH HOME=$HOME "$v=${!v}" perl -e 'alarm 3; exec @ARGV' python3 /tmp/fq.py "$v" 2>/dev/null) && echo "FAST $out"
          done
          echo done-bisect
