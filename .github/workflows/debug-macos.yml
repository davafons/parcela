name: debug macos
on: workflow_dispatch
jobs:
  debug:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci-tools
      - run: cargo build --locked
      - name: probe
        run: |
          cat > /tmp/fq.py <<'PY'
          import socket, time, sys
          t = time.time()
          print(sys.argv[1], socket.getfqdn('127.0.0.1'), round(time.time() - t, 2), flush=True)
          PY
          for n in 1 2 3; do env -i PATH=$PATH HOME=$HOME python3 /tmp/fq.py base$n; done
          scutil --dns | head -30
          sudo mkdir -p /etc/resolver
          printf 'nameserver 127.0.0.1\nport 9\n' | sudo tee /etc/resolver/in-addr.arpa
          sleep 2
          for n in 1 2 3; do env -i PATH=$PATH HOME=$HOME python3 /tmp/fq.py resolver$n; done
          python3 -m http.server 31002 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1; env -i PATH=$PATH /usr/sbin/lsof -nP -iTCP:31002 -sTCP:LISTEN; kill %1
