[package]
name = "parcela"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Workspace and local environment organizer"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
uuid = { version = "1.24", features = ["v4", "serde"] }

sha2 = "0.10"
tempfile = "3.27"

[profile.dev]
debug = 0
incremental = false
